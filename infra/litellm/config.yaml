# model_list is empty — all models are managed dynamically via the admin UI
# (stored in LiteLLM DB). On first startup, the api-server seeds the default
# model via LiteLLM's /model/new API so it is editable/deletable.
model_list: []

general_settings:
  # 以下两项由环境变量注入（docker-compose 负责设置），
  # 不要在 YAML 中硬编码真实密码 —— config.yaml 仅作为模板参考。
  #   本地开发默认值:   DATABASE_URL=postgresql://llmuser:llmpass@postgres:5432/litellm
  #                     LITELLM_MASTER_KEY=sk-master-key-change-me
  #   云端部署覆盖方式:  cp .env.cloud.example .env.cloud → 修改强密码 → deploy
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL

litellm_settings:
  # No LiteLLM-side callbacks. DLP masking is done in the api-server
  # (app/services/dlp_service.py) before the payload ever reaches this proxy.
  # The old `apps/dlp-plugin/` was deleted — it never ran (nothing mounted it,
  # and the hook names it defined do not exist in LiteLLM v1.87.1), and its
  # post-call unmasking step was explicitly rejected as a product decision.
  # See deepseek_responses_路由说明.md, "已知陷阱" #4.
  drop_params: true
  set_verbose: false

router_settings:
  routing_strategy: "usage-based-routing-v2"
  enable_pre_call_checks: true
  allowed_fails: 3
  num_retries: 2
  cooldown_time: 30
